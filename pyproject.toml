[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microscopy-qc"
version = "0.1.0"
description = "Reproducible, explainable quality control for microscopy images."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rimjhim Singh" }]
license = { text = "MIT" }
# Exact versions so every run uses the same libraries (reproducibility).
dependencies = [
    "numpy==2.5.5",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "torch==2.15.0",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[project.scripts]
mqc = "mqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
