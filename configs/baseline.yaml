# All experiment settings live here, not inside the code.
# Change a value here -> rerun -> the output metadata records exactly what was used.

seed: 42

data:
  dataset: bloodmnist      # MedMNIST subset; URL and checksum are in src/mqc/data.py
  raw_dir: data/raw
  processed_path: data/processed/qc_dataset.npz
  n_per_class: 500         # images per QC class, kept small so it runs on a laptop CPU
  split: [0.7, 0.15, 0.15] # train / val / test

qc_classes:                # labels the model learns to predict
  - good
  - blurry
  - overexposed
  - noisy

# Severity of each degradation is drawn uniformly from [low, high] per image.
# Ranges are deliberately mild: an earlier, stronger setting (blur 0.8-2.0,
# gain 1.5-2.5, noise 0.05-0.15) was solved at ~99-100% by a simple model,
# which is unrealistic and leaves nothing to compare. Subtle failures are also
# the ones that slip past a human in the lab.
degradations:
  blur_sigma: [0.4, 1.0]      # Gaussian blur, in pixels
  exposure_gain: [1.05, 1.3]  # brightness multiplier before clipping to [0, 1]
  noise_std: [0.01, 0.05]     # Gaussian noise standard deviation

# Feature-based models (Phase 3). Values are passed to scikit-learn.
models:
  logistic_regression:
    C: 1.0
  random_forest:
    n_estimators: 300
    min_samples_leaf: 2

output_dir: runs
